ul{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}

a.item{

  color:var(--ink);text-decoration:none;
}
a.item:hover{background:var(--hover)}
a.item:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.no{flex:0 0 auto;font-weight:700;color:var(--acc);min-width:1.6em}
.name{flex:1 1 auto;font-weight:600}
.meta{flex:0 0 auto;color:var(--ink2);font-size:14px}
footer{margin-top:40px;color:var(--ink2);font-size:13px}
@media (max-width:520px){
